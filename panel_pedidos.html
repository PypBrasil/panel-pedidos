<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pedidos — Panadería Brasil</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #F0E8D0; min-height: 100vh; }
  #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #fff; border-radius: 12px; padding: 2.5rem; text-align: center; max-width: 360px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  .login-card h1 { color: #2B5E35; font-size: 22px; margin-bottom: 6px; }
  .login-card p { color: #888; font-size: 13px; margin-bottom: 24px; }
  header { background: #2B5E35; padding: 0; }
  .user-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 1.25rem; background: rgba(0,0,0,0.15); }
  .user-bar span { color: rgba(240,232,208,0.7); font-size: 12px; }
  .btn-logout { background: none; border: 1px solid rgba(240,232,208,0.3); border-radius: 4px; padding: 3px 10px; color: rgba(240,232,208,0.7); font-size: 11px; cursor: pointer; font-family: Georgia, serif; }
  .header-title { padding: 0.75rem 1.25rem; }
  .header-title h1 { color: #F0E8D0; font-size: 17px; font-weight: bold; }
  .header-title p { color: rgba(240,232,208,0.6); font-size: 11px; margin-top: 2px; }
  .mes-nav { background: #2B5E35; border-top: 1px solid rgba(255,255,255,0.1); padding: 0.6rem 1.25rem; display: flex; align-items: center; gap: 12px; }
  .mes-nav button { background: rgba(255,255,255,0.15); border: none; border-radius: 6px; width: 30px; height: 30px; color: #F0E8D0; font-size: 16px; cursor: pointer; }
  .mes-label { flex: 1; text-align: center; color: #F0E8D0; font-size: 15px; font-weight: bold; }
  .count-badge { background: rgba(255,255,255,0.1); border-radius: 6px; padding: 3px 10px; color: #F0E8D0; font-size: 12px; }
  .content { padding: 1rem; max-width: 680px; margin: 0 auto; }
  .pedido-card { background: #fff; border-radius: 10px; border: 1px solid #E8D9B8; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .pedido-view { padding: 0.85rem 1rem; display: flex; align-items: flex-start; gap: 12px; }
  .fecha-badge { background: #2B5E35; border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 44px; flex-shrink: 0; }
  .fecha-dia-sem { color: rgba(240,232,208,0.7); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
  .fecha-dia-num { color: #F0E8D0; font-size: 18px; font-weight: bold; line-height: 1; }
  .pedido-info { flex: 1; min-width: 0; }
  .pedido-cliente { font-size: 14px; font-weight: bold; color: #1a1a1a; }
  .pedido-hora { display: inline-block; font-size: 12px; color: #888; background: #F0E8D0; border-radius: 4px; padding: 1px 7px; margin-left: 6px; }
  .pedido-specs { font-size: 13px; color: #555; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-editar { background: none; border: 1px solid #E8D9B8; border-radius: 6px; padding: 6px 12px; font-size: 12px; color: #2B5E35; cursor: pointer; font-family: Georgia, serif; font-weight: bold; flex-shrink: 0; }
  .btn-editar:hover { background: #F0E8D0; }
  .pedido-edit { padding: 1rem; border-top: 3px solid #2B5E35; }
  .edit-title { font-size: 12px; font-weight: bold; color: #2B5E35; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .edit-title::before { content: ''; display: block; width: 4px; height: 16px; background: #2B5E35; border-radius: 2px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11px; color: #666; }
  .field input, .field textarea { padding: 7px 10px; border: 1px solid #E8D9B8; border-radius: 6px; font-size: 14px; font-family: Georgia, serif; width: 100%; }
  .field input:focus, .field textarea:focus { outline: none; border-color: #2B5E35; }
  .err-msg { font-size: 11px; color: #e74c3c; display: none; }
  .field textarea { resize: vertical; min-height: 70px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-guardar { flex: 1; background: #2B5E35; color: #F0E8D0; border: none; border-radius: 6px; padding: 9px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: Georgia, serif; }
  .btn-guardar:hover { background: #1e4428; }
  .btn-guardar:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-cancelar { background: none; border: 1px solid #2B5E35; border-radius: 6px; padding: 9px 16px; font-size: 13px; color: #2B5E35; cursor: pointer; font-family: Georgia, serif; }
  .empty { text-align: center; padding: 3rem 1rem; color: #999; }
  .empty .icon { font-size: 40px; margin-bottom: 12px; }
  .toast { position: fixed; top: 16px; right: 16px; z-index: 1000; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-family: Georgia, serif; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: none; }
  .toast.success { background: #2B5E35; color: #F0E8D0; }
  .toast.error { background: #c0392b; color: #fff; }
  .btn-ms { background: #2B5E35; color: #F0E8D0; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-family: Georgia, serif; font-weight: bold; cursor: pointer; width: 100%; }
  .btn-ms:hover { background: #1e4428; }
  .loading { text-align: center; padding: 2rem; color: #888; font-size: 14px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Panadería y Pastelera Brasil</h1>
    <p>Panel de gestión de pedidos</p>
    <button class="btn-ms" id="btnLogin">Iniciar sesión con Microsoft</button>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <header>
    <div class="user-bar">
      <span id="userEmail"></span>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
    <div class="header-title">
      <h1>Panel de Pedidos</h1>
      <p>Panadería y Pastelera Brasil</p>
    </div>
  </header>
  <div class="mes-nav">
    <button id="btnPrev">&#8249;</button>
    <div class="mes-label" id="mesLabel"></div>
    <div class="count-badge" id="countLabel">0 pedidos</div>
    <button id="btnNext">&#8250;</button>
  </div>
  <div class="content">
    <div id="pedidosList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = "d1ce799c-b55b-4922-8e4e-4ae8e0a07f3c";
const TENANT_ID = "4c7a09bd-93f8-4e66-ae68-4f6737dbb0d0";
const SITE_HOST = "panaderiabrasil.sharepoint.com";
const SITE_PATH = "/sites/PanaderiayPasteleraBrasil-Pedidos";
const FOLDER   = "Pedidos";
const FILE     = "Pedidos y Encargos 2026.xlsx";
const TABLE    = "EncargosPedidos";
const MESES    = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS     = ["Dom","Lun","Mar","Mi\u00e9","Jue","Vie","S\u00e1b"];

let msalInstance = null;
let pedidos = [];
let mesIdx  = new Date().getMonth();
let anio    = new Date().getFullYear();
let editId  = null;
let driveId = null;
let fileId  = null;

async function initApp() {
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CLIENT_ID,
      authority: "https://login.microsoftonline.com/" + TENANT_ID,
      redirectUri: window.location.href.split("?")[0].split("#")[0]
    },
    cache: { cacheLocation: "sessionStorage" }
  });

  await msalInstance.initialize();

  const result = await msalInstance.handleRedirectPromise();
  if (result) {
    msalInstance.setActiveAccount(result.account);
    showApp(result.account.username);
    await cargarPedidos();
    return;
  }

  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    msalInstance.setActiveAccount(accounts[0]);
    showApp(accounts[0].username);
    await cargarPedidos();
  }

  document.getElementById("btnLogin").onclick = login;
  document.getElementById("btnLogout").onclick = logout;
  document.getElementById("btnPrev").onclick = function(){ cambiarMes(-1); };
  document.getElementById("btnNext").onclick = function(){ cambiarMes(1); };
}

async function login() {
  try {
    const result = await msalInstance.loginPopup({ scopes: ["Files.ReadWrite","User.Read"] });
    msalInstance.setActiveAccount(result.account);
    showApp(result.account.username);
    await cargarPedidos();
  } catch(e) {
    showToast("Error al iniciar sesion: " + e.message, "error");
  }
}

function logout() {
  msalInstance.logoutPopup().then(function(){ location.reload(); });
}

function showApp(email) {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
  document.getElementById("userEmail").textContent = email;
}

async function getToken() {
  const account = msalInstance.getActiveAccount();
  try {
    const r = await msalInstance.acquireTokenSilent({ scopes: ["Files.ReadWrite","User.Read"], account: account });
    return r.accessToken;
  } catch(e) {
    const r = await msalInstance.acquireTokenPopup({ scopes: ["Files.ReadWrite","User.Read"] });
    return r.accessToken;
  }
}

async function graphGet(url) {
  const token = await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
    headers: { Authorization: "Bearer " + token }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function graphPatch(url, body) {
  const token = await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function cargarPedidos() {
  showList("<div class='loading'>Cargando pedidos...</div>");
  try {
    const siteRes = await graphGet("/sites/" + SITE_HOST + ":" + SITE_PATH);
    const siteId = siteRes.id;
    const fileRes = await graphGet("/sites/" + siteId + "/drive/root:/" + FOLDER + "/" + FILE);
    driveId = fileRes.parentReference.driveId;
    fileId = fileRes.id;

    const colRes = await graphGet("/drives/" + driveId + "/items/" + fileId + "/workbook/tables/" + TABLE + "/columns");
    const cols = colRes.value.map(function(c){ return c.name; });

    const rowRes = await graphGet("/drives/" + driveId + "/items/" + fileId + "/workbook/tables/" + TABLE + "/rows");
    pedidos = rowRes.value.map(function(row, idx){
      const vals = row.values[0];
      const obj = { _idx: idx };
      cols.forEach(function(col, i){ obj[col] = vals[i] !== null && vals[i] !== undefined ? vals[i] : ""; });
      return obj;
    });

    renderMes();
  } catch(e) {
    showList("<div class='empty'><div class='icon'>&#9888;</div><div>Error: " + e.message + "</div></div>");
  }
}

function parseFecha(val) {
  if (!val) return null;
  const s = String(val);
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  if (!isNaN(val) && +val > 40000) {
    const d = new Date((+val - 25569) * 86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  return null;
}

function renderMes() {
  document.getElementById("mesLabel").textContent = MESES[mesIdx] + " " + anio;
  const del_mes = pedidos.filter(function(p){
    const f = parseFecha(p["Fecha del pedido"]);
    return f && f.getMonth() === mesIdx && f.getFullYear() === anio;
  }).sort(function(a,b){
    const fa = parseFecha(a["Fecha del pedido"]), fb = parseFecha(b["Fecha del pedido"]);
    if (fa-fb) return fa-fb;
    return String(a["Hora"]).localeCompare(String(b["Hora"]));
  });

  document.getElementById("countLabel").textContent = del_mes.length + " pedido" + (del_mes.length !== 1 ? "s" : "");

  if (!del_mes.length) {
    showList("<div class='empty'><div class='icon'>&#128203;</div><div>No hay pedidos en " + MESES[mesIdx] + " " + anio + "</div></div>");
    return;
  }
  showList(del_mes.map(renderPedido).join(""));

  del_mes.forEach(function(p){
    const id = p["Id"];
    const btnE = document.getElementById("btn-editar-" + id);
    if (btnE) btnE.onclick = function(){ startEdit(id); };
    const btnG = document.getElementById("btn-guardar-" + id);
    if (btnG) btnG.onclick = function(){ guardar(id, p._idx); };
    const btnC = document.getElementById("btn-cancelar-" + id);
    if (btnC) btnC.onclick = function(){ cancelarEdit(); };
  });
}

function renderPedido(p) {
  const id = p["Id"];
  const f = parseFecha(p["Fecha del pedido"]);
  const dia = f ? String(f.getDate()).padStart(2,"0") : "?";
  const diaSem = f ? DIAS[f.getDay()] : "";
  const hora = String(p["Hora"] || "");
  const cliente = String(p["Nombre Cliente/Mes\u00f3n"] || "");
  const specs = String(p["Indicar especificaciones, productos y cantidades del pedido"] || "");
  const fISO = f ? f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0") : "";

  if (editId == id) {
    return '<div class="pedido-card" id="card-' + id + '"><div class="pedido-edit"><div class="edit-title">Editando pedido #' + id + '</div><div class="grid-2"><div class="field"><label>Fecha de entrega</label><input type="date" id="ef-' + id + '" value="' + fISO + '" /></div><div class="field"><label>Hora (HH:MM)</label><input type="text" id="eh-' + id + '" value="' + esc(hora) + '" placeholder="17:35" maxlength="5" /><span class="err-msg" id="herr-' + id + '">Formato inv\u00e1lido. Usa HH:MM</span></div></div><div class="field"><label>Cliente / Mes\u00f3n</label><input type="text" id="ec-' + id + '" value="' + esc(cliente) + '" /></div><div class="field"><label>Especificaciones del pedido</label><textarea id="es-' + id + '">' + esc(specs) + '</textarea></div><div class="edit-actions"><button class="btn-guardar" id="btn-guardar-' + id + '">Guardar cambios</button><button class="btn-cancelar" id="btn-cancelar-' + id + '">Cancelar</button></div></div></div>';
  }

  return '<div class="pedido-card" id="card-' + id + '"><div class="pedido-view"><div class="fecha-badge"><div class="fecha-dia-sem">' + diaSem + '</div><div class="fecha-dia-num">' + dia + '</div></div><div class="pedido-info"><div class="pedido-cliente">' + esc(cliente) + '<span class="pedido-hora">' + esc(hora) + '</span></div><div class="pedido-specs">' + esc(specs) + '</div></div><button class="btn-editar" id="btn-editar-' + id + '">Editar</button></div></div>';
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function startEdit(id) { editId = id; renderMes(); var c = document.getElementById("card-"+id); if(c) c.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function cancelarEdit() { editId = null; renderMes(); }

async function guardar(id, rowIndex) {
  const fecha = document.getElementById("ef-"+id).value;
  const hora = document.getElementById("eh-"+id).value;
  const cliente = document.getElementById("ec-"+id).value.trim();
  const specs = document.getElementById("es-"+id).value.trim();
  const errEl = document.getElementById("herr-"+id);
  const btnEl = document.getElementById("btn-guardar-"+id);

  if (!/^([01]\d|2[0-3]):([0-5]\d)$/.test(hora)) {
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  btnEl.disabled = true;
  btnEl.textContent = "Guardando...";

  try {
    const parts = fecha.split("-");
    const fechaFmt = parts[2] + "/" + parts[1] + "/" + parts[0];
    await graphPatch("/drives/" + driveId + "/items/" + fileId + "/workbook/tables/" + TABLE + "/rows/itemAt(index=" + rowIndex + ")", { values: [[id, fechaFmt, hora, cliente, specs]] });
    const p = pedidos.find(function(x){ return x["Id"] == id; });
    if (p) {
      p["Fecha del pedido"] = fechaFmt;
      p["Hora"] = hora;
      p["Nombre Cliente/Mes\u00f3n"] = cliente;
      p["Indicar especificaciones, productos y cantidades del pedido"] = specs;
    }
    editId = null;
    renderMes();
    showToast("Pedido actualizado correctamente");
  } catch(e) {
    showToast("Error al guardar: " + e.message, "error");
    btnEl.disabled = false;
    btnEl.textContent = "Guardar cambios";
  }
}

function cambiarMes(dir) {
  editId = null;
  mesIdx += dir;
  if (mesIdx < 0) { mesIdx = 11; anio--; }
  if (mesIdx > 11) { mesIdx = 0; anio++; }
  renderMes();
}

function showList(html) { document.getElementById("pedidosList").innerHTML = html; }

function showToast(msg, type) {
  type = type || "success";
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 3500);
}

window.onload = function() { initApp(); };
</script>
</body>
</html>
